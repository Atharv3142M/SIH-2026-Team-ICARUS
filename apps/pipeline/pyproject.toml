[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin-pipeline"
version = "0.1.0"
description = "Stage 1: drone video frame extraction, filtering, and EXIF geotagging"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
masks = ["ultralytics>=8.2"]

[project.scripts]
dt-extract = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
